buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath 'com.android.tools.build:gradle:7.4.2'
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
  }
}

ext {
  compileSdkVersion = 34
  minSdkVersion = 26
  targetSdkVersion = 34
  buildToolsVersion = "34.0.0"
  suppressUnsupportedSdk = true
}

task clean(type: Delete) {
  delete rootProject.buildDir
}
