name: Build Android APK (SumoApp BLE)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Test, Prebuild & Assemble Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.3

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verify preinstalled Android SDK & accept licenses
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: TypeScript type-check
        run: pnpm run type-check

      - name: Run Jest unit tests
        run: pnpm run test:ci

      - name: Expo prebuild (Android)
        env:
          EXPO_PUBLIC_APP_ENV: production
          STRICT_ENV_VALIDATION: '1'
        run: pnpm exec expo prebuild --platform android --clean

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'package.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Assemble standalone Release APK (signed with debug keystore for direct sideload)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Locate & verify APK
        run: |
          ls -lh android/app/build/outputs/apk/release/
          cp android/app/build/outputs/apk/release/app-release.apk SumoApp-android.apk
          sha256sum SumoApp-android.apk

      - name: Upload SumoApp APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SumoApp-android-apk
          path: SumoApp-android.apk
          retention-days: 30

      - name: Publish latest APK to GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest-apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" SumoApp-android.apk --clobber
          else
            gh release create "$TAG" SumoApp-android.apk \
              --title "SumoApp BLE (Latest Android APK)" \
              --notes "Build automática via GitHub Actions para Android (BLE NUS compatível com Sumo_Auto_ESP32)."
          fi
